[project]
name = "halluscope"
version = "2.0.0a0"
description = "Probing LLM internal states to detect underspecified and inconsistent task requests before the assistant silently assumes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Varun Kadam" }]
dependencies = [
  "torch>=2.8",
  "transformers>=5.4",
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "safetensors>=0.4",
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "litellm>=1.50",
  "datasets>=3.0",
  "tqdm>=4.66",
  "orjson>=3.10",
  "matplotlib>=3.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
interp = ["nnsight>=0.6"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pre-commit>=3.7",
  "httpx>=0.27",
]

[project.scripts]
halluscope = "halluscope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halluscope"]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "server"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]
ignore = ["E501", "N803", "N806", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: needs a CUDA GPU",
  "network: needs network or API keys",
]

[tool.pyright]
include = ["src", "server"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
